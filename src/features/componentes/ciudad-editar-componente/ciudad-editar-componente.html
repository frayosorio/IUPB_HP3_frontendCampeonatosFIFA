
<div mat-dialog-content>
  <h2>{{datos.encabezado}}</h2>
  <mat-form-field appearance="fill" style="width: 100%;">
    <mat-label>Nombre</mat-label>
    <input matInput [(ngModel)]="datos.ciudad.nombre">
  </mat-form-field>
  <br>
  <mat-form-field appearance="fill" style="width: 100%;">
    <mat-label>País</mat-label>
    <mat-select [(value)]="datos.ciudad.pais" [compareWith]="compararSelecciones">
      <mat-option *ngFor="let p of datos.paises" [value]="p">
        {{p.nombre }}
      </mat-option>
    </mat-select>
  </mat-form-field>
</div>
<div mat-dialog-actions>
  <button mat-button="filled" [mat-dialog-close]="datos">Aceptar</button>
  <button mat-button="tonal" [mat-dialog-close]="">Cancelar</button>
</div>
