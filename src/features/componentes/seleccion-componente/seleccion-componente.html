<mat-toolbar class="barraTituloCRUD">
  <img src="iconos/Seleccion.png">
  <div class="barraTituloCRUD">
    Selecciones del Mundo
  </div>
</mat-toolbar>

<div>
  <mat-form-field appearance="fill">
    <mat-label>Opción de Búsqueda</mat-label>
    <mat-select [(value)]="indiceBusqueda">
      <mat-option *ngFor="let opcion of opcionesBusqueda; let i = index" [value]="i">
        {{ opcion }}
      </mat-option>
    </mat-select>
  </mat-form-field>
  <mat-form-field appearance="fill">
    <mat-label>Buscar</mat-label>
    <input matInput [(ngModel)]="textoBusqueda">
  </mat-form-field>
  <button matButton="filled" (click)="buscar()">Buscar</button>
</div>
<div>
  <button matButton="filled" (click)="agregar()">Agregar</button>
  <button matButton="tonal" (click)="modificar()">Modificar</button>
  <button matButton="outlined" (click)="eliminar()">Eliminar</button>
  <ngx-datatable [rows]="selecciones" class="dark" [columns]="columnas"
                 [headerHeight]="50" [footerHeight]="50" [limit]="10"
                 [columnMode]="modoColumna.force" [selectionType]="tipoSeleccion.single"
                 (activate)="escoger($event)"
  ></ngx-datatable>
</div>
