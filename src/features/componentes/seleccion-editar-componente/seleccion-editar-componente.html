<div mat-dialog-content>
  <h2>{{datos.encabezado}}</h2>
  <mat-form-field appearance="fill">
    <mat-label>Nombre</mat-label>
    <input matInput [(ngModel)]="datos.seleccion.nombre">
  </mat-form-field>
  <br>
  <mat-form-field appearance="fill">
    <mat-label>Entidad</mat-label>
    <input matInput [(ngModel)]="datos.seleccion.entidad">
  </mat-form-field>
</div>
<div mat-dialog-actions>
  <button mat-button="filled" [mat-dialog-close]="datos">Aceptar</button>
  <button mat-button="tonal" [mat-dialog-close]="">Cancelar</button>
</div>
